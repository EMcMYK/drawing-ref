name: Build 3D object library

# Scans the Sand3D datasets on Hugging Face (license check of every row),
# sorts objects into the categories in scripts/objects/categories.json and converts them to small gray GLB files in
# public/objects/. On pull requests it converts a small sample as a check;
# run it by hand ("Run workflow") to build and commit the library to the
# branch it ran on, with a contact sheet per category in
# scripts/objects/review/ for checking the picks (bad ones go in
# scripts/objects/exclude.txt, then run it again).
on:
  pull_request:
    paths:
      - 'scripts/objects/**'
      - '.github/workflows/build-objects.yml'
  workflow_dispatch:
    inputs:
      per_category:
        description: 'How many objects per category'
        required: false
        default: '40'

permissions:
  contents: write

concurrency:
  group: build-objects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Libraries Blender needs
        run: sudo apt-get update -q && sudo apt-get install -yq libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1

      - name: Python packages
        run: pip install "bpy==5.2.*" "huggingface_hub>=1,<3" "pyarrow>=18" "pillow>=11"

      - name: Fetch the GLB compressor once (builds run in parallel)
        run: npx -y @gltf-transform/cli@4.5.1 --version

      - name: Build objects (sample)
        if: github.event_name == 'pull_request'
        run: python -I scripts/objects/build.py --per-category 1 --out sample-objects --review sample-review

      - name: Build objects
        if: github.event_name == 'workflow_dispatch'
        env:
          PER_CATEGORY: ${{ inputs.per_category }}
        run: python -I scripts/objects/build.py --per-category "$PER_CATEGORY" --review scripts/objects/review

      - name: Summary
        if: always()
        run: cat objects-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objects
          path: |
            sample-objects/
            sample-review/
            public/objects/
            scripts/objects/review/
            objects-summary.md
          if-no-files-found: ignore

      - name: Commit the objects
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp objects-summary.md public/objects/SUMMARY.md
          git add public/objects scripts/objects/review
          if git diff --cached --quiet; then
            echo "No changes to the objects."
          else
            git commit -m "Update 3D object library"
            git push
          fi
