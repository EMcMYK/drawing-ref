name: Build reference library

# Pulls images from the approved sources' APIs, filters them, and writes
# public/library/*.json. On pull requests it runs a small sample as a check;
# run it by hand ("Run workflow") for the full build, which commits the
# result to the branch it ran on. Every Monday it also refreshes the live
# library on main: it keeps what's there, adds new images (about a tenth of
# each source's usual count) and, past 1,000 per category, drops the oldest.
# The commit to main redeploys the site.
on:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - 'scripts/library/**'
      - '.github/workflows/build-library.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these categories (comma-separated ids), blank for all'
        required: false
        default: ''
      refresh:
        description: 'Refresh (keep current images, add new ones) instead of a full rebuild'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: build-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build library (sample)
        if: github.event_name == 'pull_request'
        run: node scripts/library/build.mjs --scale 0.05 --out sample-library

      - name: Refresh library (sample)
        if: github.event_name == 'pull_request'
        run: node scripts/library/build.mjs --scale 0.05 --out sample-library --refresh 0.5

      - name: Build library (full)
        if: github.event_name == 'workflow_dispatch' && !inputs.refresh
        run: node scripts/library/build.mjs ${{ inputs.only && format('--only {0}', inputs.only) || '' }}

      - name: Refresh library (add new images)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: node scripts/library/build.mjs --refresh 0.1 ${{ inputs.only && format('--only {0}', inputs.only) || '' }}

      - name: Summary
        if: always()
        run: cat library-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library
          path: |
            sample-library/
            public/library/
            library-summary.md
          if-no-files-found: ignore

      - name: Commit the library
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/library
          if git diff --cached --quiet; then
            echo "No changes to the library."
          else
            git commit -m "${{ github.event_name == 'schedule' && 'Weekly reference library refresh' || 'Update reference library index' }}"
            git push
          fi
